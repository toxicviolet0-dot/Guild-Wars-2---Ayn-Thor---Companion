name: Build Tyria Hub APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with this build'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag for the release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare environment file
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-asset
          cp app/build/outputs/apk/debug/*.apk release-asset/tyria-hub.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tyria-hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Run unit & Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: Tyria Hub ${{ github.ref_name || inputs.release_tag }}
          files: release-asset/tyria-hub.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
